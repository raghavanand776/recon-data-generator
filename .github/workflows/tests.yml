# recon-data-generator / .github/workflows/tests.yml
# Author:  Raghav Anand
# Created: 2026-11-06
# Runs the pytest suite on GitHub's servers on every push and pull request.

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v